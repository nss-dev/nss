---
trust-domain: nss

task-priority: lowest

workers:
    aliases:
        images:
            provisioner: 'nss-{level}'
            implementation: docker-worker
            os: linux
            worker-type: linux-docker
        images-aarch64:
            provisioner: 'nss-{level}'
            implementation: docker-worker
            os: linux
            worker-type: images-aarch64
        b-linux:
            provisioner: 'nss-{level}'
            implementation: docker-worker
            os: linux
            worker-type: linux-docker
        b-linux-aarch64:
            provisioner: 'nss-{level}'
            implementation: docker-worker
            os: linux
            worker-type: b-linux-aarch64
        b-win2022:
            provisioner: 'nss-{level}'
            implementation: generic-worker
            os: windows
            worker-type: b-win2022
        b-win-aarch64:
            provisioner: 'nss-{level}'
            implementation: generic-worker
            os: windows
            worker-type: win11-a64-25h2-builder
        b-osx:
            provisioner: releng-hardware
            implementation: generic-worker
            os: macosx
            worker-type: 'nss-{level}-b-osx-1015'
        t-linux:
            provisioner: nss-t
            implementation: docker-worker
            os: linux
            worker-type: t-linux-docker
        t-linux-aarch64:
            provisioner: nss-t
            implementation: docker-worker
            os: linux
            worker-type: t-linux-arm64-docker
        t-win-aarch64:
            provisioner: nss-t
            implementation: generic-worker
            os: windows
            worker-type: win11-a64-25h2

taskgraph:
    repositories:
        nss:
            name: NSS
            project-regex: nss
        nspr:
            name: NSPR
            project-regex: nspr
            default-repository: https://github.com/mozilla/nspr
            default-ref: main
            type: git

    decision-parameters: 'nss_taskgraph:decision_parameters'
    register: 'nss_taskgraph:register'

treeherder:
    group-names:
        I: Docker image builds
        Builds: Builds with alternative compilers
        Cipher: Cipher tests
        Cryptofuzz: Cryptofuzz
        DBM: Legacy (DBM) database
        Gtest: Gtests
        FIPS: FIPS
        SSL: SSL tests
        TLS: TLS fuzzing
