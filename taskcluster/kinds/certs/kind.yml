---

loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.from_deps
    - nss_taskgraph.transforms.treeherder
    - nss_taskgraph.transforms.platforms
    - taskgraph.transforms.run
    # Has to see the env that taskgraph.transforms.run sets.
    - nss_taskgraph.transforms.hg_store
    - taskgraph.transforms.task

kind-dependencies:
    - build

tasks:
    certs:
        description: Generate certificates
        from-deps:
            copy-attributes: true
            with-attributes:
                certs: [true]
                # No cert-using test runs on legacy-db or make-FIPS builds, so
                # nothing would fetch these certs.
                dbm: [false]
                make-fips: [false]
        run:
            using: run-task
            checkout:
                nss:
                    path: nss
            command:
                by-platform:
                    win.*: $VCS_PATH/nss/automation/taskcluster/windows/gen_certs.sh
                    default: $VCS_PATH/nss/automation/taskcluster/scripts/gen_certs.sh
        worker:
            max-run-time: 3600
            env:
                TC_PARENT_TASK_ID: {task-reference: '<build>'}
            artifacts:
                by-platform:
                    linux.*:
                        - type: directory
                          path: /builds/worker/artifacts
                          name: public
                    win.*:
                        - type: directory
                          path: public/build
                    mac.*:
                        - type: directory
                          path: public
            docker-image: {in-tree: base}
        worker-type:
            by-platform:
                linux-aarch64.*: b-linux-aarch64
                # Matches x86 linux only; the lookahead keeps it from also
                # matching linux-aarch64 (keyed-by forbids two matching arms).
                linux(?!-aarch64).*: b-linux
                # certutil is a target binary, so cert generation for the
                # cross-built win-aarch64 has to happen on ARM64 hardware.
                win-aarch64.*: b-win-aarch64
                win(?!-aarch64).*: b-win2022
                mac.*: b-osx
        treeherder:
            symbol: Certs
